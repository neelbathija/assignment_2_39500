<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Sum</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Two Sum</h1>
      <p>Find two numbers in an array that add up to a target value.</p>

      <h2>Array</h2>
      <p id="array"></p>
      <form id="add-form">
        <label for="number">Number to add:</label>
        <input id="number" type="number" step="1" required>
        <button type="submit">Add</button>
        <button id="delete" type="button">Delete</button>
      </form>
      <p id="error" role="alert"></p>

      <h2>Results</h2>
      <p id="target"></p>
      <p id="sum"></p>
      <p id="result"></p>
    </main>
  </body>
</html>
