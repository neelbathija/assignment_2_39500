<!DOCTYPE html>

  <head>

  </head>
  <body>
    <main>
      <h1>Two Sum</h1>
      <p>Find two numbers in an array that add up to a target value.</p>

      <h2>Array</h2>
      <p>[2, 7, 11, 15]</p>

      <h2>Example</h2>
      <p>Target: 9</p>
      <p>2 + 7 = 9</p>
      <p> Result: [0, 1]</p>
    </main>
